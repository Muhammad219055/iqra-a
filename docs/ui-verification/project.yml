name: QuranUICheck
options:
  bundleIdPrefix: com.local.qurancheck
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    CODE_SIGNING_ALLOWED: NO
targets:
  QuranUICheck:
    type: application
    platform: iOS
    sources: [Host]
  ReaderTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: QuranUICheck
schemes:
  QuranUICheck:
    build:
      targets:
        QuranUICheck: all
        ReaderTests: [test]
    test:
      targets: [ReaderTests]
